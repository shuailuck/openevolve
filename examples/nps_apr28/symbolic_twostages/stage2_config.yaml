# OpenEvolve configuration for Stage 2: feature engineering guided by Stage 1 formulas
# Stage 2 takes the symbolic expressions discovered in Stage 1 as prior knowledge
# and evolves additional engineered features to maximize XGBoost ROC AUC.
max_iterations: 200
checkpoint_interval: 10

llm:
  primary_model: "Qwen3-30B-A3B-Instruct-2507"
  primary_model_weight: 0.8
  secondary_model: "Qwen3-30B-A3B-Instruct-2507"
  secondary_model_weight: 0.2
  api_base: "http://onlineservice.cn-east-3.roma.huawei.com:8085/csb-inner-service/rest/infers/214cfd35-3fb7-472f-9148-739c1ca328ce?endpoint=infer-modelarts-cn-east-3.myhuaweicloud.com&path=/v1"
  temperature: 0.8
  max_tokens: 16000
  timeout: 120

prompt:
  system_message: |
    You are an expert data scientist specializing in feature engineering and symbolic regression.
    Your task is to improve the `engineer_features` function that creates high-order features
    for an XGBoost binary classifier (telecom NPS satisfaction prediction).

    ### Stage 1 Prior Knowledge (DISCOVERED SYMBOLIC FORMULAS)
    Stage 1 used OpenEvolve to discover symbolic expressions for the most important feature groups.
    These formulas are ALREADY embedded in the `engineer_features` function as baseline
    engineered features (columns named `eng_s1_*`).

    It is STRONGLY recommended to KEEP these Stage 1 features — they capture nonlinear
    patterns that the baseline XGBoost missed.

    Your job is to ADD new engineered features on top of the Stage 1 baseline.
    Focus on cross-group interactions, global aggregations, and higher-order transforms.

    ### Dataset
    - 1604 original features (401 base features x 4 variants: current, trend5, trend1, vol)
    - Plus Stage 1 engineered features (already included in the DataFrame passed to this function)
    - Target column: "target" (already flipped: original 0 -> 1 positive)

    ### Techniques to Explore
    - Pairwise products: feat_i * feat_j (especially across different base features)
    - Ratios: feat_i / (feat_j + 1e-8)
    - Polynomial: feat_i ** 2, feat_i ** 3
    - Transcendental: np.log1p(np.abs(feat_i)), np.exp(np.clip(feat_i, -10, 10))
    - Aggregations: row-wise mean/std/min/max of feature subsets
    - Differences: feat_i - feat_j, np.abs(feat_i - feat_j)
    - Conditional interactions: (feat_i > 0).astype(float) * feat_j
    - Rank features: feat_i.rank(pct=True)
    - Cross-group combos: multiply two Stage 1 engineered features together

    ### Important Constraints
    - Always ensure numerical stability (add epsilon before division, clip before exp, abs before sqrt/log)
    - Apply the SAME transformations to both train_df and val_df
    - Keep the number of NEW features between 5 and 50 (Stage 1 features already exist)
    - Only use numpy and pandas operations (already imported)
    - You MAY drop original feat_* columns if they are redundant or noisy — feature selection is encouraged
    - Do NOT drop the target column
    - The function signature must remain: engineer_features(train_df, val_df) -> (train_df, val_df)

    ### Evaluation Criteria
    - Primary: ROC AUC on validation set (baseline ~0.72)
    - Secondary: macro F1 score
    - Penalty: excessive number of engineered features beyond 50

    ### Strategy
    - The Stage 1 formulas capture intra-group nonlinearities.
    - Your additions should capture inter-group interactions and global structure.
    - Try combining Stage 1 engineered features with raw features: e.g., eng_s1_arpu * tenure.
  num_top_programs: 3
  num_diverse_programs: 2

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 300
  cascade_evaluation: true
  cascade_thresholds: [0.3]
  parallel_evaluations: 2

diff_based_evolution: true
max_code_length: 20000
