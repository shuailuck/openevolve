# Stage 1 Symbolic Regression Configuration
# Each group independently discovers interpretable formulas that predict NPS
# via sigmoid + cross-entropy optimization.
max_iterations: 150
checkpoint_interval: 10

# LLM configuration
llm:
  primary_model: "Qwen3-30B-A3B-Instruct-2507"
  primary_model_weight: 0.8
  secondary_model: "Qwen3-30B-A3B-Instruct-2507"
  secondary_model_weight: 0.2
  api_base: "http://onlineservice.cn-east-3.roma.huawei.com:8085/csb-inner-service/rest/infers/214cfd35-3fb7-472f-9148-739c1ca328ce?endpoint=infer-modelarts-cn-east-3.myhuaweicloud.com&path=/v1"
  temperature: 0.8
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  system_message: |
    You are an expert ML Engineer. Your task is to optimize the `predict_nps` function
    to discover interpretable formulas for NPS (Net Promoter Score) classification.

    ### Context:
    This is one group in a two-stage pipeline. The module-level variable GROUP_COLS
    lists the ~20 features assigned to this group. Inspect it to understand which
    features are available. Each feature comes from 4 derived variants of base
    telecom features (__current, __trend5, __trend1, __vol).

    ### Goal:
    Discover a formula that outputs NPS logits (promoter=0 / detractor=1).
    The evaluator applies sigmoid + binary cross-entropy loss, optimized via BFGS
    starting from params=zeros. Higher validation AUC = better score.

    ### Core Constraints (STRICT):
    1. **Signature**: `predict_nps(df, params) -> np.ndarray` (1D, length == len(df)).
    2. **Parametric Weights**: NEVER hardcode constants. Use `params[i]` for ALL
       coefficients so BFGS can tune them.
       *Bad*: `0.5 * X[:, 0]`
       *Good*: `params[0] * X[:, 0] + params[1] * X[:, 1]`
    3. **Inputs**: `df` is a DataFrame. Access columns via `X = df.values.astype(np.float64)`
       then `X[:, i]` for the i-th feature. See GROUP_COLS for column names.
    4. **Output**: Raw logits (1D ndarray) — sigmoid is applied externally.
    5. **MAX_NPARAMS**: You have up to MAX_NPARAMS params available.

    ### Search Space:
    - **Linear**: `params[i] * X[:, i]`
    - **Interactions**: `params[k] * X[:, i] * X[:, j]`, `X[:, i] / (X[:, j] + 1e-8)`
    - **Nonlinear**: `np.log1p(np.abs(X[:, i]))`, `np.sqrt(np.abs(X[:, i]))`,
      `np.exp(np.clip(X[:, i], -10, 10))`
    - **Conditional**: `np.where(X[:, i] > params[m], params[n] * X[:, j], 0)`
    - **Stability**: Always `1e-8` for division, `np.abs()` for log/sqrt,
      `np.clip()` for exp, `np.nan_to_num()` for NaN safety.

    ### Strategy:
    - Focus on the 8-12 strongest features — sparse models generalize better.
    - Discover multiplicative interactions between related features (e.g., current × trend).
    - Use `np.where` to model subgroup heterogeneity.
    - Keep the formula interpretable and numerically stable.

    Final code: `numpy` and `pandas` only.

  num_top_programs: 3
  num_diverse_programs: 2

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

# Evaluator configuration
evaluator:
  timeout: 300
  cascade_evaluation: true
  cascade_thresholds: [0.1]
  parallel_evaluations: 4

# Evolution settings
diff_based_evolution: true
max_code_length: 20000
