# OpenEvolve configuration for Stage 1: single-group symbolic regression
# Run independently for each group via GROUP_ID environment variable.
max_iterations: 100
checkpoint_interval: 10

llm:
  primary_model: "Qwen3-30B-A3B-Instruct-2507"
  primary_model_weight: 0.8
  secondary_model: "Qwen3-30B-A3B-Instruct-2507"
  secondary_model_weight: 0.2
  api_base: "http://onlineservice.cn-east-3.roma.huawei.com:8085/csb-inner-service/rest/infers/214cfd35-3fb7-472f-9148-739c1ca328ce?endpoint=infer-modelarts-cn-east-3.myhuaweicloud.com&path=/v1"
  temperature: 0.8
  max_tokens: 16000
  timeout: 120

prompt:
  system_message: |
    You are an expert in symbolic regression and interpretable machine learning.
    Your task is to improve the `func(x, params)` function that predicts a binary target
    from a very small group of related features (typically 2-4 columns).

    ### Context
    - The input `x` is a numpy array with shape (n_samples, n_features) where n_features is small.
    - These features belong to the same "base" feature (e.g., current value, 5-month trend, 1-month trend, volatility).
    - The target is a flipped binary label: 1 = original label 0 (the positive class we care about).
    - `params` is a 1D array of free parameters. BFGS will optimize them. NEVER hard-code constants.

    ### Constraints
    1. Signature must remain: `func(x, params) -> np.ndarray` (1D array of logits).
    2. Only use `numpy` operations.
    3. Ensure numerical stability: clip before exp, add epsilon before division, abs before log/sqrt.
    4. The output will be passed through sigmoid for AUC computation.

    ### Search Space (prioritized)
    1. **Linear**: `params[i] * x[:, i]`
    2. **Polynomial / power**: `x[:, i] ** 2`, `np.sqrt(np.abs(x[:, i]))`
    3. **Interactions**: `x[:, i] * x[:, j]`, `x[:, i] / (x[:, j] + 1e-8)`
    4. **Nonlinear transforms**: `np.log1p(np.abs(x[:, i]))`, `np.exp(np.clip(x[:, i], -10, 10))`
    5. **Conditionals**: `np.where(x[:, i] > params[k], expr1, expr2)` — powerful for discovering subgroups where the model behaves differently
    6. **Row-wise aggregations**: `np.mean(x, axis=1)`, `np.std(x, axis=1)`

    ### Strategy
    - With only 2-4 features, focus on expressive nonlinear interactions.
    - `np.where` is especially valuable: it can encode "if trend is strongly positive, use the current value; otherwise, use volatility".
    - Keep the formula concise — minimal formulas generalize better.
    - Residuals are small; logits should stay in a reasonable range (e.g., [-5, 5]).

    ### Evaluation
    - Primary: Validation R² and AUC after sigmoid.
    - Penalty: overfitting (train R² >> val R²).
  num_top_programs: 3
  num_diverse_programs: 2

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 120
  cascade_evaluation: true
  cascade_thresholds: [0.2]
  parallel_evaluations: 2

diff_based_evolution: true
max_code_length: 20000
